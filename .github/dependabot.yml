version: 2
updates:
  - package-ecosystem: uv
    directory: /
    versioning-strategy: auto
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      minor-updates:
        update-types:
          - "minor"
      patch-updates:
        update-types:
          - "patch"
    patterns:
      - "*"
