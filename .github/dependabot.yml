version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/workflows/setup-fandango   # composite action, also uses setup-uv
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      minor-and-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"