[package]
name = "fandango-native"
version = "1.1.1"
edition = "2021"

[lib]
name = "native"
crate-type = ["cdylib"]

[dependencies]
# Stable ABI (PEP 384) for regular CPython: one cp311-abi3 wheel covers 3.11+.
# When PyO3 cannot use abi3 (e.g. free-threaded), it falls back to a
# version-specific wheel; build.rs mirrors that via pyo3-build-config.
# See https://pyo3.rs/main/building-and-distribution.html#py_limited_apiabi3abi3t
pyo3 = { version = "0.29", features = ["abi3-py311", "experimental-inspect"] }

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
glob = "0.3"
pyo3-build-config = "0.29"

[target.'cfg(windows)'.build-dependencies]
python3-dll-a = "0.2"
