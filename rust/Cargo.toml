[package]
name = "fandango-native"
version = "1.1.1"
edition = "2021"

[lib]
name = "native"
crate-type = ["cdylib"]

[dependencies]
# Build against Python's stable ABI (PEP 384) with 3.11 as the minimum version.
# Wheels are tagged cp311-abi3 and run on 3.11+ without per-version rebuilds.
# See pyproject.toml requires-python and https://pyo3.rs/main/building-and-distribution.html#py_limited_apiabi3abi3t
pyo3 = { version = "0.29", features = ["abi3-py311", "experimental-inspect"] }

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
glob = "0.3"

[target.'cfg(windows)'.build-dependencies]
python3-dll-a = "0.2"
